name: deploy

on:
  workflow_call:
    inputs:
      stage:
        description: 'Environment name (e.g. "staging", "live") - used for the GitHub Environment'
        required: true
        type: string
      bedrock_root:
        description: 'Path to the Bedrock root in the repo (contains composer.json)'
        required: false
        type: string
        default: 'wp'
      keep_backups:
        description: 'Number of compressed previous releases to keep in deployments/backups'
        required: false
        type: number
        default: 3
    secrets:
      SSH_CONFIG:
        description: 'SSH config block (Host, HostName, User, Port) - any Host alias'
        required: true
      SSH_PRIVATE_KEY:
        required: true

jobs:
  get-env-vars:
    uses: ./.github/workflows/job-get-env-vars.yml
    with:
      stage: ${{ inputs.stage }}

  deployment-wordpress:
    needs: [get-env-vars]
    uses: ./.github/workflows/job-deployment-wordpress.yml
    with:
      stage: ${{ inputs.stage }}
      bedrock_root: ${{ inputs.bedrock_root }}
      keep_backups: ${{ inputs.keep_backups }}
      php: ${{ needs.get-env-vars.outputs.php }}
      node: ${{ needs.get-env-vars.outputs.node }}
      server_deployment_dir_path: ${{ needs.get-env-vars.outputs.server_deployment_dir_path }}
      server_public_dir_path: ${{ needs.get-env-vars.outputs.server_public_dir_path }}
      server_uploads_dir_path: ${{ needs.get-env-vars.outputs.server_uploads_dir_path }}
      server_env_path: ${{ needs.get-env-vars.outputs.server_env_path }}
      local_public_dir_path: ${{ needs.get-env-vars.outputs.local_public_dir_path }}
      local_uploads_dir_path: ${{ needs.get-env-vars.outputs.local_uploads_dir_path }}
      server_post_deployment_commands: ${{ needs.get-env-vars.outputs.server_post_deployment_commands }}
    secrets:
      SSH_CONFIG: ${{ secrets.SSH_CONFIG }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
