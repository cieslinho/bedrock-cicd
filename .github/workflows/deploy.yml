name: Deploy Bedrock

on:
  workflow_call:
    inputs:
      stage:
        description: 'Deployer stage/host defined in deploy.php (e.g. "staging", "live")'
        required: true
        type: string
      bedrock_root:
        description: 'Path to the Bedrock root in the repo (contains composer.json, deploy.php)'
        required: false
        type: string
        default: 'wp'
    secrets:
      SSH_CONFIG:
        description: 'SSH config block (Host, HostName, User, Port, IdentityFile)'
        required: true
      SSH_PRIVATE_KEY:
        required: true

jobs:
  deploy:
    name: Deploy (${{ inputs.stage }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # .ddev/config.yaml is the single source of truth for PHP/Node
      # versions - read from it instead of duplicating the values here,
      # so CI can never drift from the local dev container.
      - name: Read PHP/Node versions from DDEV config
        id: versions
        run: |
          echo "php=$(grep '^php_version:' .ddev/config.yaml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "node=$(grep '^nodejs_version:' .ddev/config.yaml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.versions.outputs.php }}
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: npm
          cache-dependency-path: ${{ inputs.bedrock_root }}/**/package-lock.json

      # shivammathur/setup-php has no built-in cache, unlike setup-node -
      # cache Composer's own download cache (not vendor/) so a hit still
      # re-resolves and re-links, just skips re-downloading packages.
      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles(format('{0}/**/composer.lock', inputs.bedrock_root)) }}
          restore-keys: composer-${{ runner.os }}-

      # Requires a `cicd-build` target in the caller repo's Makefile
      # (composer install + asset build for every buildable directory).
      - name: Composer install and asset build
        run: make cicd-build

      # Deployer is a CI tool, not a project dependency - it must not
      # live in the Bedrock composer.json, since `composer install
      # --no-dev` above strips require-dev and would remove it from the
      # build. deployer.org/deployer.phar serves a stale v6 build -
      # GitHub Releases has the current one.
      - name: Install Deployer
        run: |
          curl -sL https://github.com/deployphp/deployer/releases/latest/download/deployer.phar -o deployer.phar
          chmod +x deployer.phar

      # Checked out separately from the Bedrock build for the same
      # reason - the recipe is not a composer dependency of the project.
      - name: Checkout bedrock-cicd recipe
        uses: actions/checkout@v7
        with:
          repository: cieslinho/bedrock-cicd
          path: .bedrock-cicd

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_CONFIG }}" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/deploy_key" >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          HOSTNAME=$(awk '/HostName/{print $2}' ~/.ssh/config | head -1)
          PORT=$(awk '/Port/{print $2}' ~/.ssh/config | head -1)
          ssh-keyscan -p ${PORT:-22} "$HOSTNAME" >> ~/.ssh/known_hosts

      - name: Deployer release
        working-directory: ${{ inputs.bedrock_root }}
        env:
          CI_BUILD_PATH: ${{ github.workspace }}/${{ inputs.bedrock_root }}
          BEDROCK_CICD_RECIPE: ${{ github.workspace }}/.bedrock-cicd/recipe/bedrock.php
        run: php ${{ github.workspace }}/deployer.phar deploy ${{ inputs.stage }} -f deploy.php --no-interaction -vv

      - name: Cleanup runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
