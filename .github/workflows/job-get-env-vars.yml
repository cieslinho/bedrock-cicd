name: job-get-env-vars

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
    outputs:
      php:
        value: ${{ jobs.get-env-vars.outputs.php }}
      node:
        value: ${{ jobs.get-env-vars.outputs.node }}
      server_deployment_dir_path:
        value: ${{ jobs.get-env-vars.outputs.server_deployment_dir_path }}
      server_public_dir_path:
        value: ${{ jobs.get-env-vars.outputs.server_public_dir_path }}
      server_uploads_dir_path:
        value: ${{ jobs.get-env-vars.outputs.server_uploads_dir_path }}
      server_env_path:
        value: ${{ jobs.get-env-vars.outputs.server_env_path }}
      local_public_dir_path:
        value: ${{ jobs.get-env-vars.outputs.local_public_dir_path }}
      local_uploads_dir_path:
        value: ${{ jobs.get-env-vars.outputs.local_uploads_dir_path }}
      server_post_deployment_commands:
        value: ${{ jobs.get-env-vars.outputs.server_post_deployment_commands }}
      server_wp_cli:
        value: ${{ jobs.get-env-vars.outputs.server_wp_cli }}

jobs:
  get-env-vars:
    name: get-env-vars
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    outputs:
      php: ${{ steps.ddev.outputs.php }}
      node: ${{ steps.ddev.outputs.node }}
      server_deployment_dir_path: ${{ steps.vars.outputs.server_deployment_dir_path }}
      server_public_dir_path: ${{ steps.vars.outputs.server_public_dir_path }}
      server_uploads_dir_path: ${{ steps.vars.outputs.server_uploads_dir_path }}
      server_env_path: ${{ steps.vars.outputs.server_env_path }}
      local_public_dir_path: ${{ steps.vars.outputs.local_public_dir_path }}
      local_uploads_dir_path: ${{ steps.vars.outputs.local_uploads_dir_path }}
      server_post_deployment_commands: ${{ steps.vars.outputs.server_post_deployment_commands }}
      server_wp_cli: ${{ steps.vars.outputs.server_wp_cli }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # .ddev/config.yaml is the single source of truth for PHP/Node
      # versions - read from it instead of duplicating the values here,
      # so CI can never drift from the local dev container.
      - name: Read PHP/Node versions from .ddev/config.yaml
        id: ddev
        run: |
          echo "php=$(grep '^php_version:' .ddev/config.yaml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "node=$(grep '^nodejs_version:' .ddev/config.yaml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      # Values reach the script through env:, never pasted into it with ${{ }} — a value containing $, quotes or newlines
      # (e.g. post-deployment commands using $WP_CLI) would otherwise be re-parsed by the runner's shell.
      - name: Read deployment paths from GitHub Environment vars
        id: vars
        env:
          SERVER_DEPLOYMENT_DIR_PATH: ${{ vars.BEDROCK_DEPLOYMENT_SERVER_DEPLOYMENT_DIR_PATH }}
          SERVER_PUBLIC_DIR_PATH: ${{ vars.BEDROCK_DEPLOYMENT_SERVER_PUBLIC_DIR_PATH }}
          SERVER_UPLOADS_DIR_PATH: ${{ vars.BEDROCK_DEPLOYMENT_SERVER_UPLOADS_DIR_PATH }}
          SERVER_ENV_PATH: ${{ vars.BEDROCK_DEPLOYMENT_SERVER_ENV_PATH }}
          LOCAL_PUBLIC_DIR_PATH: ${{ vars.BEDROCK_DEPLOYMENT_LOCAL_PUBLIC_DIR_PATH }}
          LOCAL_UPLOADS_DIR_PATH: ${{ vars.BEDROCK_DEPLOYMENT_LOCAL_UPLOADS_DIR_PATH }}
          SERVER_POST_DEPLOYMENT_COMMANDS: ${{ vars.BEDROCK_DEPLOYMENT_SERVER_POST_DEPLOYMENT_COMMANDS }}
          SERVER_WP_CLI: ${{ vars.BEDROCK_DEPLOYMENT_SERVER_WP_CLI }}
        run: |
          {
            printf 'server_deployment_dir_path=%s\n' "$SERVER_DEPLOYMENT_DIR_PATH"
            printf 'server_public_dir_path=%s\n' "$SERVER_PUBLIC_DIR_PATH"
            printf 'server_uploads_dir_path=%s\n' "$SERVER_UPLOADS_DIR_PATH"
            printf 'server_env_path=%s\n' "$SERVER_ENV_PATH"
            printf 'local_public_dir_path=%s\n' "$LOCAL_PUBLIC_DIR_PATH"
            printf 'local_uploads_dir_path=%s\n' "$LOCAL_UPLOADS_DIR_PATH"
            printf 'server_post_deployment_commands<<COMMANDS_EOF\n%s\nCOMMANDS_EOF\n' "$SERVER_POST_DEPLOYMENT_COMMANDS"
            # The command that runs WP-CLI on the server (DB backup before the swap). Plain `wp` unless the host's default
            # CLI PHP is older than the project needs — e.g. "/opt/alt/php84/usr/bin/php /usr/local/bin/wp".
            printf 'server_wp_cli=%s\n' "${SERVER_WP_CLI:-wp}"
          } >> "$GITHUB_OUTPUT"
